services:
  nip46-relay:
    build: .
    container_name: nip46-relay
    restart: unless-stopped
    ports:
      - "3334:3334"
    # Relay configuration comes from .env (copy .env.example to .env).
    # Optional so `docker compose up` still works before you create it.
    env_file:
      - path: .env
        required: false
    environment:
      # Container-specific path; overrides .env so data lands in the volume.
      # Only used when STORAGE_BACKEND=badger.
      WORKING_DIR: "/app/data"
    volumes:
      - nip46_data:/app/data

volumes:
  nip46_data:
